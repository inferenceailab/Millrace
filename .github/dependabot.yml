# Dependabot was already producing security alerts; this adds routine updates, so a dependency is
# bumped before an advisory forces it. Grouped and monthly, because the failure mode of dependency
# automation is a stream of pull requests nobody reads.
version: 2

updates:
  # Action versions are the supply-chain surface with the least visibility: release.yml's steps only
  # run on a tag, so a stale or yanked action is not discovered until someone publishes (§11.39).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Central package management, so every bump lands in Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Runtime dependencies move together or not at all — a partial Microsoft.Extensions.* bump is
      # a version-conflict pull request rather than an upgrade.
      microsoft-extensions:
        patterns: ['Microsoft.Extensions.*']
      test:
        patterns: ['xunit*', 'Microsoft.NET.Test.Sdk', 'Microsoft.AspNetCore.TestHost', 'Testcontainers*', 'Microsoft.Playwright']

  # The two UI bundles are built here and shipped prebuilt, so these never reach a consumer — but
  # they do run on developer machines and in CI, which is where a compromised build tool bites.
  - package-ecosystem: npm
    directory: /src/Millrace.Dashboard.Ui.React/ui
    schedule:
      interval: monthly
    groups:
      react-ui:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /src/Millrace.Dashboard.Ui.Angular/ui
    schedule:
      interval: monthly
    groups:
      angular-ui:
        patterns: ['*']
    ignore:
      # Angular pins the compiler to a TypeScript range — @angular/compiler-cli@22 declares
      # >=6.0 <6.1 — so a TypeScript major is unbuildable here until Angular widens it, and
      # Dependabot would propose it every month regardless (#139). Minor and patch still come
      # through. Delete this when Angular supports the next major; the bump is wanted, not unwanted.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
