name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runners have Docker, so the PostgreSQL conformance suite must actually run.
          # If a database cannot be reached the job fails rather than skipping all 70 facts and
          # still reporting "Test Run Successful".
          - os: ubuntu-latest
            require_postgres: 'true'
          # Windows runners cannot run Linux containers, so the PostgreSQL suite skips here by
          # design. Provider coverage comes from the Linux job above. This opt-out is explicit so
          # the skip is a decision rather than an accident.
          - os: windows-latest
            require_postgres: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        env:
          # Absent this, the harness falls back to CI being set, which is also strict.
          MILLRACE_REQUIRE_POSTGRES: ${{ matrix.require_postgres }}
        run: dotnet test --no-build --configuration Release --verbosity normal
