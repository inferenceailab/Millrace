name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runners have Docker, so both provider conformance suites must actually run.
          # If a database cannot be reached the job fails rather than skipping the facts and still
          # reporting "Test Run Successful".
          - os: ubuntu-latest
            require_postgres: 'true'
            require_sqlserver: 'true'
          # Windows runners cannot run Linux containers, so both suites skip here by design.
          # Provider coverage comes from the Linux job above. These opt-outs are explicit so the
          # skips are decisions rather than accidents.
          - os: windows-latest
            require_postgres: 'false'
            require_sqlserver: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Millrace.Dashboard.Ui.React compiles its embedded bundle during the .NET build. Consumers
      # of the published package never need Node — building this repository does.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        env:
          # Absent this, the harness falls back to CI being set, which is also strict.
          MILLRACE_REQUIRE_POSTGRES: ${{ matrix.require_postgres }}
          MILLRACE_REQUIRE_SQLSERVER: ${{ matrix.require_sqlserver }}
          # No browser is installed on these jobs, so the UI rendering suite skips here. The
          # coverage comes from the `browser` job below, which installs one and is strict. Stated
          # explicitly because the default is strict: a job that says nothing about this and has no
          # browser fails, which is the right way round.
          MILLRACE_REQUIRE_BROWSER: 'false'
        run: dotnet test --no-build --configuration Release --verbosity normal

  # The only job that executes a UI (#126, §11.40). Everything else in this repository checks the
  # bundles statically — parity reads compiled bytes for a substring, packaging asserts exported
  # types — and none of that notices a UI that renders nothing, which is exactly how the Blazor one
  # reached main in #120.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # The UI bundles must really be built here — this job serves them to a real browser, so
      # SkipUiBuild would leave it testing three empty packages and passing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Build
        run: dotnet build test/Millrace.Dashboard.BrowserTests/Millrace.Dashboard.BrowserTests.csproj --configuration Release

      - name: Install Chromium
        run: pwsh test/Millrace.Dashboard.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        env:
          # Strict, and redundantly so: CI alone would make it strict. Written out because this is
          # the one job whose entire purpose is that a missing browser is a failure.
          MILLRACE_REQUIRE_BROWSER: 'true'
        run: dotnet test test/Millrace.Dashboard.BrowserTests/Millrace.Dashboard.BrowserTests.csproj --no-build --configuration Release --verbosity normal

  # The benchmark harness compiled in CI and never executed there — four months passed between #49
  # publishing the table and #156 running it again, and "does it still work" was unanswerable for
  # all of them. docs/benchmarks.md already told a reader to do a small run before trusting the
  # harness; this is that instruction as a job.
  #
  # It is not a measurement and its numbers must not reach docs/benchmarks.md. 500 jobs on a shared
  # runner measures the runner. What it proves is that the harness starts, connects, seeds, drains,
  # times, aggregates and exits 0.
  #
  # All four scenarios rather than the drain-only sanity run a human does, because the point is
  # rot: the latency scenario has a PeriodicTimer and percentile code that drain never touches, and
  # workflow has its own engine path. Drain alone would leave three quarters of the harness
  # unexecuted, which is the situation this job exists to end. Sizes are the smallest that still
  # exercise each path — about half a minute in total.
  #
  # Millrace only. Hangfire and WorkflowCore are third-party comparands; whether *their* packages
  # still work is not what this is guarding.
  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Matches bench/docker-compose.yml, including the port, so the harness's own default
      # connection string is what gets exercised rather than a CI-only override. The tuning flags
      # the compose file sets are deliberately absent: they exist to stop any comparand being
      # advantaged in a real measurement, and this is not one.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: millrace
          POSTGRES_PASSWORD: millrace
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U millrace"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # No setup-node, on purpose. The harness references Millrace and the PostgreSQL provider and
      # nothing else, so no UI bundle is in its graph — and if one ever is, this job fails rather
      # than quietly growing a Node dependency, the same way the docs job guards the same claim.
      - name: Sanity run
        run: >-
          dotnet run -c Release --project bench/Millrace.Benchmarks --
          --system millrace --jobs 500 --instances 100 --rate 50 --seconds 3 --repeats 1

  # Packing on every push, not only on a tag: the failures packaging introduces — a dependency the
  # solution supplied by project reference, an embedded resource that did not survive pack — are
  # invisible to the build and test jobs, and finding them at release time means finding them under
  # pressure.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - run: dotnet pack Millrace.slnx -c Release -o artifacts

      - name: Smoke test the packages
        shell: pwsh
        run: ./scripts/smoke-test-packages.ps1 -Packages "$PWD/artifacts"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/*
