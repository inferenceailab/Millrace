name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runners have Docker, so both provider conformance suites must actually run.
          # If a database cannot be reached the job fails rather than skipping the facts and still
          # reporting "Test Run Successful".
          - os: ubuntu-latest
            require_postgres: 'true'
            require_sqlserver: 'true'
          # Windows runners cannot run Linux containers, so both suites skip here by design.
          # Provider coverage comes from the Linux job above. These opt-outs are explicit so the
          # skips are decisions rather than accidents.
          - os: windows-latest
            require_postgres: 'false'
            require_sqlserver: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Millrace.Dashboard.Ui.React compiles its embedded bundle during the .NET build. Consumers
      # of the published package never need Node — building this repository does.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        env:
          # Absent this, the harness falls back to CI being set, which is also strict.
          MILLRACE_REQUIRE_POSTGRES: ${{ matrix.require_postgres }}
          MILLRACE_REQUIRE_SQLSERVER: ${{ matrix.require_sqlserver }}
        run: dotnet test --no-build --configuration Release --verbosity normal

  # Packing on every push, not only on a tag: the failures packaging introduces — a dependency the
  # solution supplied by project reference, an embedded resource that did not survive pack — are
  # invisible to the build and test jobs, and finding them at release time means finding them under
  # pressure.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - run: dotnet pack Millrace.slnx -c Release -o artifacts

      - name: Smoke test the packages
        shell: pwsh
        run: ./scripts/smoke-test-packages.ps1 -Packages "$PWD/artifacts"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*
