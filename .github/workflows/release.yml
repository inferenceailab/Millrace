# Publishes to NuGet from a tag, so a release is a commit anyone can point at rather than whatever
# happened to be on somebody's laptop. The version comes from the tag alone (§11.31).
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Lets the job ask GitHub for the OIDC token nuget.org exchanges for a publishing key (§11.33).
  # Omitting it does not fail loudly — the token request simply returns nothing.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Source Link records the commit, so the shallow default would leave the packages pointing
          # at a commit the repository cannot resolve.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Needed to BUILD the UI packages, never to consume them. The smoke test below is what keeps
      # that distinction honest.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Derive the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not contain a version." && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A SemVer prerelease is anything with a hyphen after the version core. Derived rather
          # than passed, because the tag is already the single source of the version and a second
          # place to say "this one is an alpha" is a second place to forget. Without the flag
          # GitHub marks the release Latest, so 0.1.0-alpha.1 sat on the front page as though it
          # were the recommended version.
          case "$version" in
            *-*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=" >> "$GITHUB_OUTPUT" ;;
          esac

          echo "Releasing $version"

      - name: Pack
        run: >
          dotnet pack Millrace.slnx -c Release -o artifacts
          -p:Version=${{ steps.version.outputs.version }}
          -p:VersionSuffix=

      # The artifact is what consumers get, so it is what gets tested. A package that restores but
      # cannot run, or a UI package whose embedded bundle did not survive packing, fails here rather
      # than on nuget.org where it cannot be unpublished.
      - name: Smoke test the packages
        shell: pwsh
        run: >
          ./scripts/smoke-test-packages.ps1
          -Packages "$PWD/artifacts"
          -Version ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/*

      # Trusted Publishing (§11.33): nuget.org validates a GitHub OIDC token against a policy naming
      # this repository and this workflow file, then issues a key valid for one hour and usable once.
      # There is no stored secret to leak or rotate. Requested here rather than at the top of the job
      # because the hour starts now, and pack and the smoke test come first.
      - name: NuGet login (OIDC exchange)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: inferenceailab

      - name: Push to NuGet
        run: |
          # --skip-duplicate so re-running a release that failed halfway is safe: the packages
          # already pushed are accepted rather than failing the whole job.
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*.nupkg --generate-notes ${{ steps.version.outputs.prerelease }}
