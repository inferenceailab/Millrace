<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Millrace">
  <!--
    A millrace: the engineered channel that carries water to the wheel. Streamlines entering from the
    left, narrowing as the channel directs them, driving the wheel on the right.

    One mid-tone accent throughout, chosen to hold contrast against both the light and the dark
    navbar — the navbar renders this as an <img>, so `currentColor` is not available to it.
  -->
  <g fill="none" stroke="#2f95bd" stroke-linecap="round">
    <!-- The race: three streamlines, converging as the channel narrows. -->
    <path d="M1 10h13" stroke-width="2.5" opacity=".55"/>
    <path d="M1 16h15" stroke-width="2.5"/>
    <path d="M1 22h13" stroke-width="2.5" opacity=".55"/>
  </g>
  <!-- The wheel. -->
  <g stroke="#2f95bd" stroke-width="2.5" stroke-linecap="round">
    <circle cx="23" cy="16" r="7" fill="none"/>
    <path d="M23 9v14M16 16h14M18 11l10 10M28 11L18 21" stroke-width="1.5" opacity=".7"/>
  </g>
</svg>
